services:

  postgres:
    image: postgres:16
    container_name: cloudcart-postgres
    environment:
      POSTGRES_DB: cloudcart
      POSTGRES_USER: cloudcart_app
      POSTGRES_PASSWORD: cloudcart_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloudcart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcart_app -d cloudcart"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    build:
      context: ./services/product-service
    container_name: cloudcart-product-service
    environment:
      DATABASE_URL: postgresql+psycopg://cloudcart_app:cloudcart_dev_password@postgres:5432/cloudcart
      ENVIRONMENT: docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudcart
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: cloudcart-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - product-service
    networks:
      - cloudcart

networks:
  cloudcart:

volumes:
  postgres_data: