name: CloudCart CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  test:
    name: Test Product Service
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudcart_app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cloudcart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudcart_app -d cloudcart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://cloudcart_app:password@localhost:5432/cloudcart

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/product-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit Python dependencies
        working-directory: services/product-service
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run database migrations
        working-directory: services/product-service
        run: |
          alembic upgrade head

      - name: Run tests
        working-directory: services/product-service
        run: |
          pytest -v

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4